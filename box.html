<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест — Код города</title>
    <style>
        /* ===== БАЗОВЫЙ CSS ДЛЯ КВЕСТА ===== */
        body {
            background: #080c1a;
            color: #e8edf2;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .terminal {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(16, 24, 44, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
        }
        .line {
            margin-bottom: 10px;
            color: #e8edf2;
        }
        .line.dim { color: #5a6a80; }
        .line .error { color: #ff6b6b; }
        .line .success { color: #6fcf97; }
        .input-row input {
            background: rgba(8, 12, 26, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            color: #e8edf2;
            padding: 8px;
            width: 200px;
        }
        .input-row button {
            background: #ff6b35;
            color: #080c1a;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
        }
        .clue-block {
            background: rgba(16, 24, 44, 0.4);
            padding: 20px;
            margin: 16px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .clue-label { color: #5a6a80; font-size: 12px; text-transform: uppercase; }
        .terminal-link { color: #ff6b35; text-decoration: underline; }
        .terminal-btn {
            background: #ff6b35;
            color: #080c1a;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
        }
        .terminal-btn.danger {
            background: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div id="boxContent" class="terminal">
        <!-- Сюда box.js вставит содержимое -->
    </div>

    <script type="module" src="js/box.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/quests-data.js"></script>
</body>
</html>
