<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пропуск — Код города</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pass.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">🗺️ Код города</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="pass.html" class="active">Пропуск</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="pass-section">
            <div class="container">
                <div class="pass-container">
                    <h1 class="pass-title">🔐 ОФИЦИАЛЬНЫЙ ПРОПУСК</h1>
                    <p class="pass-subtitle">Предъявите при необходимости сотрудникам охраны или полиции</p>

                    <div class="pass-form">
                        <div class="form-group">
                            <label for="playerName">Ваше имя</label>
                            <input type="text" id="playerName" placeholder="Например: Евгений" maxlength="30">
                        </div>
                        <div class="form-group">
                            <label for="questSelect">Выберите квест</label>
                            <select id="questSelect">
                                <!-- Загружается из JS -->
                            </select>
                        </div>
                        <button class="btn-primary" onclick="generatePass()">🎫 Сгенерировать пропуск</button>
                    </div>

                    <div id="passCard" style="display: none;">
                        <!-- Генерируется из JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>🗺️ Код города · Череповец · 2026</p>
        </div>
    </footer>

    <script src="js/boxes-data.js"></script>
    <script src="js/pass.js"></script>
</body>
</html>
