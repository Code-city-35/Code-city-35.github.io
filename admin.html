<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Код города</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <img src="assets/logo.png" alt="Код города" class="logo-img" style="height:60px; width:auto;">
            </div>
            <nav>
                <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
                <div class="nav-links" id="navLinks">
                    <a href="index.html">Главная</a>
                    <a href="catalog.html">Каталог</a>
                    <a href="pass.html">Пропуск</a>
                    <a href="rules.html">Правила</a>
                    <a href="blog.html">Блог</a>
                    <a href="admin.html" class="active admin-link">⚙️ Админка</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div id="adminContent">
                    <!-- Загружается из admin.js -->
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Код города · Череповец · 2026</p>
            <p class="footer-small">* Участие в квесте добровольное. Будьте внимательны на улицах.</p>
        </div>
    </footer>

    <!-- Подключаем админку как модуль (она сама импортирует всё необходимое) -->
    <script type="module" src="js/admin.js"></script>

    <!-- Бургер-меню (обычный скрипт, не модуль) -->
    <script>
        const burger = document.getElementById('burgerBtn');
        const navLinks = document.getElementById('navLinks');
        burger.addEventListener('click', function() {
            this.classList.toggle('active');
            navLinks.classList.toggle('open');
        });
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                navLinks.classList.remove('open');
            });
        });
    </script>
</body>
</html>
