<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Код города</title>
    <style>
        /* ============================================================
           ПОЛНЫЙ CSS ДЛЯ АДМИНКИ (admin.html)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080c1a;
            color: #e8edf2;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 40px),
                radial-gradient(circle at 20% 30%, rgba(255,107,53,0.02), transparent 50%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Шапка */
        .main-header {
            padding: 20px 0;
            border-bottom: 2px solid rgba(255, 107, 53, 0.15);
            position: sticky;
            top: 0;
            backdrop-filter: blur(16px);
            background: rgba(8, 12, 26, 0.75);
            z-index: 100;
        }
        .main-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            height: 60px;
            width: auto;
            display: block;
        }

        nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        nav a {
            color: #8a9bb5;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 16px;
            transition: 0.25s;
            text-decoration: none;
            position: relative;
            border: none;
            background: none;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #ff6b35;
            transition: 0.3s;
        }
        nav a:hover::after { width: 60%; }
        nav a:hover { color: #fff; }
        nav a.active {
            color: #ff6b35;
            font-weight: 600;
        }
        nav a.active::after { width: 60%; }
        nav a.admin-link {
            border: 1px solid rgba(255, 107, 53, 0.3);
            padding: 6px 16px;
            color: #ff6b35;
            border-radius: 0;
        }
        nav a.admin-link:hover {
            background: #ff6b35;
            color: #080c1a;
        }
        nav a.admin-link::after { display: none; }

        /* Бургер-меню */
        .burger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
            background: none;
            border: none;
        }
        .burger span {
            display: block;
            width: 28px;
            height: 3px;
            background: #e8edf2;
            transition: 0.3s;
            border-radius: 0;
        }
        .burger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .burger.active span:nth-child(2) { opacity: 0; }
        .burger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Стили для админки */
        .admin-login {
            max-width: 400px;
            margin: 20px auto;
        }
        .admin-login input {
            width: 100%;
            background: rgba(8, 12, 26, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            color: #e8edf2;
            padding: 12px 16px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            transition: 0.2s;
        }
        .admin-login input:focus {
            border-color: #ff6b35;
            outline: none;
        }
        .admin-login button { margin-top: 12px; }

        .admin-panel .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .admin-panel .admin-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .admin-panel .admin-stats .stat {
            background: rgba(16, 24, 44, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 24px;
            text-align: center;
            flex: 1;
            min-width: 100px;
        }
        .admin-panel .admin-stats .stat .num {
            font-size: 28px;
            font-weight: 800;
            color: #ff6b35;
            display: block;
        }
        .admin-panel .admin-stats .stat .label {
            font-size: 12px;
            color: #5a6a80;
        }
        .admin-panel .box-admin-item {
            background: rgba(16, 24, 44, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: 0.3s;
        }
        .admin-panel .box-admin-item:hover {
            border-color: rgba(255, 107, 53, 0.15);
        }
        .admin-panel .box-admin-item .info .title {
            font-size: 16px;
            font-weight: 700;
            color: #e8edf2;
        }
        .admin-panel .box-admin-item .info .sub {
            color: #8a9bb5;
            font-size: 13px;
        }
        .admin-panel .box-admin-item .actions button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: #8a9bb5;
            padding: 4px 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: 0.2s;
        }
        .admin-panel .box-admin-item .actions button:hover {
            border-color: #ff6b35;
            color: #e8edf2;
        }
        .admin-panel .box-admin-item .actions button.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.2);
        }
        .admin-panel .box-admin-item .actions button.danger:hover {
            border-color: #ff6b6b;
        }

        /* Модалка */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: rgba(16, 24, 44, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 32px 28px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-bottom: 16px;
            font-size: 22px;
            font-weight: 700;
            color: #ff6b35;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }
        .modal .field {
            margin-bottom: 14px;
        }
        .modal .field label {
            display: block;
            color: #8a9bb5;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .modal .field input,
        .modal .field textarea,
        .modal .field select {
            width: 100%;
            background: rgba(8, 12, 26, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            color: #e8edf2;
            padding: 10px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }
        .modal .field input:focus,
        .modal .field textarea:focus,
        .modal .field select:focus {
            border-color: #ff6b35;
            outline: none;
        }
        .modal .field textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal .field .toggle-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .modal .field .toggle-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #8a9bb5;
        }
        .modal .field .toggle-group input[type="checkbox"] {
            width: auto;
            accent-color: #ff6b35;
        }
        .modal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
        .modal .modal-actions button {
            padding: 8px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            background: transparent;
            color: #8a9bb5;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .modal-actions button:hover {
            border-color: #ff6b35;
            color: #e8edf2;
        }
        .modal .modal-actions button.cancel {
            color: #5a6a80;
        }
        .modal .modal-actions button.save {
            background: #ff6b35;
            color: #080c1a;
            border-color: #ff6b35;
            font-weight: 700;
        }
        .modal .modal-actions button.save:hover {
            background: #ff8a5c;
            border-color: #ff8a5c;
        }

        /* Блок улик в админке */
        .modal .clue-block {
            border: 1px solid rgba(255,255,255,0.06);
            padding: 12px;
            margin-top: 8px;
            background: rgba(8, 12, 26, 0.4);
        }
        .modal .clue-block label {
            display: block;
            color: #5a6a80;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .modal .clue-block input,
        .modal .clue-block select {
            width: 100%;
            background: rgba(8, 12, 26, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            color: #e8edf2;
            padding: 6px 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .modal .clue-block input:focus,
        .modal .clue-block select:focus {
            border-color: #ff6b35;
            outline: none;
        }
        .modal .clue-block .clue-actions {
            display: flex;
            justify-content: flex-end;
        }

        /* Футер */
        .main-footer {
            background: rgba(8, 12, 26, 0.8);
            backdrop-filter: blur(10px);
            padding: 32px 0;
            border-top: 2px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            margin-top: 60px;
            position: relative;
        }
        .main-footer::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: #ff6b35;
            opacity: 0.2;
        }
        .main-footer p { color: #4a5a70; font-size: 14px; }
        .footer-small { font-size: 12px; margin-top: 4px; opacity: 0.6; }

        /* Адаптив */
        @media (max-width: 768px) {
            .burger { display: flex; }
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(8, 12, 26, 0.95);
                backdrop-filter: blur(16px);
                flex-direction: column;
                padding: 20px 24px;
                gap: 12px;
                border-bottom: 2px solid rgba(255, 107, 53, 0.1);
                display: none;
                z-index: 99;
            }
            .nav-links.open { display: flex; }
            .main-header .container { position: relative; }
            nav { flex-wrap: wrap; }
            .logo-img { height: 40px; }
        }

        @media (max-width: 480px) {
            .logo-img { height: 32px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="logo">
                <img src="assets/logo.png" alt="Код города" class="logo-img" style="height:60px; width:auto;">
            </div>
            <nav>
                <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
                <div class="nav-links" id="navLinks">
                    <a href="index.html">Главная</a>
                    <a href="catalog.html">Каталог</a>
                    <a href="pass.html">Пропуск</a>
                    <a href="rules.html">Правила</a>
                    <a href="admin.html" class="active admin-link">⚙️ Админка</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="section" style="padding:40px 0 60px;">
            <div class="container">
                <div id="adminContent" class="admin-panel">
                    <!-- Загружается из admin.js -->
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Код города · Череповец · 2026</p>
            <p class="footer-small">* Участие в квесте добровольное. Будьте внимательны на улицах.</p>
        </div>
    </footer>

    <script src="js/boxes-data.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const burger = document.getElementById('burgerBtn');
        const navLinks = document.getElementById('navLinks');
        burger.addEventListener('click', function() {
            this.classList.toggle('active');
            navLinks.classList.toggle('open');
        });
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                navLinks.classList.remove('open');
            });
        });
    </script>

</body>
</html>
